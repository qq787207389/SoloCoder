<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>淘金者 - Find Gold</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #4a4a6a;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    #hud {
      position: absolute;
      top: -40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      color: #ffd700;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    #overlay h1 {
      color: #ffd700;
      font-size: 48px;
      text-shadow: 3px 3px 0 #8b4513;
      margin-bottom: 20px;
    }
    #overlay p {
      font-size: 18px;
      margin: 8px 0;
      color: #ccc;
    }
    #overlay button {
      margin-top: 30px;
      padding: 12px 40px;
      font-size: 20px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
      border: 3px solid #8b4513;
      color: #4a2c00;
      cursor: pointer;
      transition: transform 0.1s;
    }
    #overlay button:hover {
      transform: scale(1.05);
    }
    #overlay button:active {
      transform: scale(0.95);
    }
    .hidden {
      display: none !important;
    }
    .controls {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }
    .controls span {
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div>关卡: <span id="level">1</span></div>
      <div>金块: <span id="gold">0</span>/<span id="total-gold">0</span></div>
      <div>时间: <span id="time">0</span>s</div>
      <div>得分: <span id="score">0</span></div>
      <div>生命: <span id="lives">3</span></div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="overlay">
      <h1>淘 金 者</h1>
      <p>收集所有金块，爬上出口梯子过关</p>
      <p>按 <span>Z</span> 键挖洞困住敌人</p>
      <div class="controls">
        <p><span>← →</span> 移动 | <span>↑ ↓</span> 爬梯子 | <span>Z</span> 挖洞</p>
        <p><span>R</span> 重新开始 | <span>P</span> 暂停</p>
      </div>
      <button id="start-btn">开始游戏</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
