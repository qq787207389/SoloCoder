<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荒野生存 - Survival Wild</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #1a1a2e; 
      overflow: hidden; 
      font-family: 'Microsoft YaHei', sans-serif;
      color: #fff;
    }
    #gameCanvas {
      display: block;
      cursor: crosshair;
    }
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #4a4a4a;
      border-radius: 8px;
      padding: 10px;
    }
    #statusPanel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 200px;
    }
    .stat-bar {
      margin: 5px 0;
    }
    .stat-label {
      font-size: 12px;
      margin-bottom: 2px;
    }
    .bar-container {
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.3s;
    }
    .bar-hunger { background: linear-gradient(90deg, #e67e22, #f39c12); }
    .bar-thirst { background: linear-gradient(90deg, #3498db, #2980b9); }
    .bar-stamina { background: linear-gradient(90deg, #27ae60, #2ecc71); }
    .bar-health { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    #inventoryPanel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }
    .inv-slot {
      width: 50px;
      height: 50px;
      background: rgba(50, 50, 50, 0.8);
      border: 2px solid #555;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .inv-slot.selected {
      border-color: #f1c40f;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }
    .inv-count {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }
    .inv-icon {
      font-size: 24px;
    }
    #craftPanel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 250px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    #craftPanel.show { display: block; }
    .recipe {
      padding: 8px;
      margin: 5px 0;
      background: rgba(60, 60, 60, 0.8);
      border-radius: 4px;
      cursor: pointer;
    }
    .recipe:hover { background: rgba(80, 80, 80, 0.8); }
    .recipe.available { border-left: 3px solid #27ae60; }
    .recipe.unavailable { border-left: 3px solid #c0392b; opacity: 0.7; }
    .recipe-name { font-weight: bold; margin-bottom: 4px; }
    .recipe-ingredients { font-size: 11px; color: #aaa; }
    #minimap {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 150px;
      height: 150px;
      border: 2px solid #4a4a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    #hotbar {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }
    .hotbar-slot {
      width: 50px;
      height: 50px;
      background: rgba(50, 50, 50, 0.8);
      border: 2px solid #555;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .hotbar-slot.active {
      border-color: #3498db;
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
    }
    .hotbar-key {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 10px;
      color: #aaa;
    }
    #messageLog {
      position: absolute;
      bottom: 130px;
      left: 10px;
      width: 300px;
      max-height: 150px;
      overflow: hidden;
      pointer-events: none;
    }
    .message {
      padding: 4px 8px;
      margin: 2px 0;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      font-size: 12px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
    #buildMode {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      display: none;
      flex-direction: column;
      gap: 5px;
    }
    #buildMode.show { display: flex; }
    .build-item {
      padding: 8px 12px;
      background: rgba(50, 50, 50, 0.8);
      border: 2px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .build-item:hover { background: rgba(70, 70, 70, 0.8); }
    .build-item.selected { border-color: #f1c40f; }
    #timeWeather {
      position: absolute;
      top: 10px;
      left: 220px;
      width: 120px;
      text-align: center;
    }
    .time-icon { font-size: 24px; }
    .weather-info { font-size: 12px; color: #aaa; }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      pointer-events: auto;
    }
    #gameOver.show { display: block; }
    #gameOver h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
    }
    #gameOver button {
      padding: 15px 30px;
      font-size: 18px;
      background: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    #gameOver button:hover { background: #2ecc71; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="controls">
      WASD移动 | 空格交互 | E背包 | C合成 | B建造 | 1-5选择物品 | 鼠标左键使用/攻击
    </div>
    <div id="statusPanel" class="panel">
      <div class="stat-bar">
        <div class="stat-label">❤️ 生命</div>
        <div class="bar-container"><div class="bar-fill bar-health" id="healthBar" style="width: 100%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">🍖 饥饿</div>
        <div class="bar-container"><div class="bar-fill bar-hunger" id="hungerBar" style="width: 100%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">💧 口渴</div>
        <div class="bar-container"><div class="bar-fill bar-thirst" id="thirstBar" style="width: 100%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">⚡ 体力</div>
        <div class="bar-container"><div class="bar-fill bar-stamina" id="staminaBar" style="width: 100%"></div></div>
      </div>
    </div>
    <div id="timeWeather" class="panel">
      <div class="time-icon" id="timeIcon">☀️</div>
      <div class="weather-info" id="weatherInfo">晴朗</div>
      <div class="weather-info" id="dayInfo">第 1 天</div>
    </div>
    <canvas id="minimap"></canvas>
    <div id="craftPanel" class="panel">
      <h4 style="margin-bottom: 10px">🔨 合成</h4>
      <div id="recipeList"></div>
    </div>
    <div id="buildMode" class="panel">
      <h4 style="margin-bottom: 10px">🏗️ 建造</h4>
    </div>
    <div id="messageLog"></div>
    <div id="hotbar"></div>
    <div id="inventoryPanel"></div>
    <div id="gameOver" class="panel">
      <h1 id="endTitle">游戏结束</h1>
      <p id="endMessage" style="margin-bottom: 20px"></p>
      <button onclick="location.reload()">重新开始</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
