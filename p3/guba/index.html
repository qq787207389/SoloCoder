<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赤色要塞 - 古巴战士 致敬版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
    }
    
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    #game-canvas {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      border: 4px solid #4a4a4a;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.5);
    }
    
    #game-info {
      margin-top: 10px;
      color: #00ff00;
      font-size: 12px;
      text-align: center;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
    }
    
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="game-info">
      操作: WASD移动 | J射击 | K手雷 | L切换武器 | ESC暂停
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
