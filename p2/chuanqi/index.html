<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龙城战歌 - 传奇网页版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
    }
    
    #gameCanvas {
      display: block;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    #loading h1 {
      color: #ffd700;
      font-size: 48px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 20px;
    }
    
    #loading p {
      color: #aaa;
      font-size: 16px;
    }
    
    #instructions {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>龙城战歌</h1>
    <p>正在加载游戏资源...</p>
  </div>
  
  <canvas id="gameCanvas"></canvas>
  
  <div id="instructions">
    WASD / 方向键移动 | 数字键 1-4 使用技能 | 点击怪物选中目标 | 点击物品拾取
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
